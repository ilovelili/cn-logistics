
[functions.provision-auth0-user]
enabled = true
# Auth0 issues the caller JWT, so the Supabase gateway cannot verify it as a
# Supabase Auth token. The function forwards the Auth0 bearer token to PostgREST,
# where Supabase third-party Auth validates it before any user lifecycle action.
verify_jwt = false
import_map = "./functions/provision-auth0-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/provision-auth0-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/provision-auth0-user/*.html" ]

[functions.send-shipment-notification-email]
enabled = true
verify_jwt = false
import_map = "./functions/send-shipment-notification-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-shipment-notification-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-shipment-notification-email/*.html" ]

[functions.preview-shipment-document]
enabled = true
# Auth0 issues the caller JWT. The function forwards it to PostgREST, where
# Supabase third-party Auth validates it before the preview path is authorized.
verify_jwt = false
import_map = "./functions/preview-shipment-document/deno.json"
entrypoint = "./functions/preview-shipment-document/index.ts"
